name: Build and Release DMG for Pomia

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Build app
        run: |
          xcodebuild -scheme Pomia \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            MACOSX_DEPLOYMENT_TARGET=26.2
      
      - name: Create DMG
        run: |
          # Create a temporary directory for the DMG contents
          mkdir -p dmg_temp/Pomia
          
          # Copy the app to the temporary directory
          cp -r build/Build/Products/Release/Pomia.app dmg_temp/Pomia/
          
          # Create a symlink to /Applications for easy installation
          ln -s /Applications dmg_temp/Pomia/Applications
          
          # Create the DMG
          hdiutil create -volname Pomia \
            -srcfolder dmg_temp/Pomia \
            -ov -format UDZO \
            Pomia.dmg
          
          # Clean up
          rm -rf dmg_temp
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          name: Pomia ${{ steps.version.outputs.VERSION }}
          files: Pomia.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

