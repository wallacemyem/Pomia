name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Build app
        run: |
          xcodebuild -scheme Pomia \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            build
      
      - name: Create DMG
        run: |
          # Create a temporary directory for the DMG contents
          mkdir -p dmg_temp/Pomia
          
          # Copy the app to the temporary directory
          cp -r build/Build/Products/Release/Pomia.app dmg_temp/Pomia/
          
          # Create a symlink to /Applications for easy installation
          ln -s /Applications dmg_temp/Pomia/Applications
          
          # Create the DMG
          hdiutil create -volname Pomia \
            -srcfolder dmg_temp/Pomia \
            -ov -format UDZO \
            Pomia.dmg
          
          # Clean up
          rm -rf dmg_temp
      
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Pomia ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
      
      - name: Upload DMG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Pomia.dmg
          asset_name: Pomia-${{ steps.version.outputs.VERSION }}.dmg
          asset_content_type: application/octet-stream
